<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Research Tracker</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2333;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --blue: #58a6ff;
      --gold: #e3b341;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #1f6feb, #58a6ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .logo h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    .logo span {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: 4px;
      font-weight: 400;
    }
    .header-date {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ── Main ── */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ── Section title ── */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .section-header h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .entry-count {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Entry grid ── */
    .entries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    /* ── Entry card ── */
    .entry-card {
      display: block;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 20px 18px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      cursor: pointer;
    }
    .entry-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #1f6feb, #58a6ff);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .entry-card:hover {
      border-color: #58a6ff66;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .entry-card:hover::before {
      opacity: 1;
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      margin-bottom: 10px;
    }

    .card-ticker {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--blue);
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 6px;
    }

    .card-company {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-rating {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
    }
    .rating-high { color: #39d353; background: #0f2a1a; }
    .rating-mid  { color: #d29922; background: #2a1f0a; }

    .card-arrow {
      font-size: 0.9rem;
      color: var(--border);
      transition: color 0.2s, transform 0.2s;
    }
    .entry-card:hover .card-arrow {
      color: var(--blue);
      transform: translateX(3px);
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }
    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.4;
    }
    .empty-state h3 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 0.85rem;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 40px 24px;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#9642;</div>
    <h1>Stock Research Tracker <span>/ Log</span></h1>
  </div>
  <span class="header-date" id="header-date"></span>
</header>

<main>
  <div class="section-header">
    <h2>Research Entries</h2>
    <span class="entry-count" id="entry-count"></span>
  </div>
  <div class="entries-grid" id="entries-grid"></div>
</main>

<footer>
  Stock Research Tracker &mdash; for informational purposes only. Not investment advice.
</footer>

<script>
  // ── Entry registry ──────────────────────────────────────────────────────────
  // Add a new object here for each research log entry.
  const ENTRIES = [
    {
      date:        '2026-05-21',
      displayDate: 'May 21, 2026',
      ticker:      'PWR',
      company:     'Quanta Services',
      rating:      '9.2/10',
      ratingClass: 'rating-high',
      path:        'entries/2026-05-21-PWR.html'
    },
    {
      date:        '2026-05-19',
      displayDate: 'May 19, 2026',
      ticker:      'OSCR',
      company:     'Oscar Health',
      rating:      '8.9/10',
      ratingClass: 'rating-high',
      path:        'entries/2026-05-19-OSCR.html'
    },
    {
      date:        '2026-05-18',
      displayDate: 'May 18, 2026',
      ticker:      'NVDA',
      company:     'NVIDIA Corporation',
      rating:      '9.1/10',
      ratingClass: 'rating-high',
      path:        'entries/2026-05-18-NVDA.html'
    },
    {
      date:        '2026-05-15',
      displayDate: 'May 15, 2026',
      ticker:      'AMAT',
      company:     'Applied Materials',
      rating:      '9.1/10',
      ratingClass: 'rating-high',
      path:        'entries/2026-05-15-AMAT.html'
    },
    {
      date:        '2026-05-14',
      displayDate: 'May 14, 2026',
      ticker:      'NBIS',
      company:     'Nebius Group',
      rating:      '9.1/10',
      ratingClass: 'rating-high',
      path:        'entries/2026-05-14-NBIS.html'
    },
    {
      date:        '2026-05-13',
      displayDate: 'May 13, 2026',
      ticker:      'AKAM',
      company:     'Akamai Technologies Inc',
      rating:      '9.2/10',
      ratingClass: 'rating-high',
      path:        'entries/2026-05-13-AKAM.html'
    }
  ];
  // ────────────────────────────────────────────────────────────────────────────

  // Sort newest first
  ENTRIES.sort((a, b) => b.date.localeCompare(a.date));

  // Header date
  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

  // Render
  const grid  = document.getElementById('entries-grid');
  const count = document.getElementById('entry-count');

  if (ENTRIES.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">&#128202;</div>
        <h3>No entries yet</h3>
        <p>Add your first research log entry to get started.</p>
      </div>`;
    count.textContent = '';
  } else {
    count.textContent = ENTRIES.length + (ENTRIES.length === 1 ? ' entry' : ' entries');
    ENTRIES.forEach(e => {
      const card = document.createElement('a');
      card.className = 'entry-card';
      card.href = e.path;
      card.innerHTML = `
        <div class="card-date">${e.displayDate}</div>
        <div class="card-ticker">${e.ticker}</div>
        <div class="card-company">${e.company}</div>
        <div class="card-footer">
          <span class="card-rating ${e.ratingClass}">${e.rating}</span>
          <span class="card-arrow">&#8594;</span>
        </div>`;
      grid.appendChild(card);
    });
  }
</script>

</body>
</html>
